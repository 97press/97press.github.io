<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Spike Pult</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--txt:#e8eaef;--dim:#8a91a0;--acc:#3ddc84;--warn:#ffb020;--bad:#ff4d4f;--kick:#ff8a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.3 system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:nowrap}
button.on{background:var(--acc);color:#000;border-color:var(--acc)}
button:disabled{opacity:.35}
#status{margin-right:auto;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--acc)}.dot.mid{background:var(--warn)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0}

/* ---- пульт ---- */
#pad{flex:1;display:grid;grid-template-columns:1fr 130px 1fr;min-height:0}
#pad.swap #drive{order:3}#pad.swap #mid{order:2}#pad.swap #act{order:1}
.zone{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#gas{width:min(75%,230px);aspect-ratio:1;border-radius:50%;background:var(--panel);border:3px solid var(--line);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none}
#gas.active{background:var(--acc);color:#000;border-color:var(--acc)}
#hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--dim);font-size:13px;pointer-events:none}
.sb,.sk{position:absolute;display:none;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.sb{width:140px;height:140px;border:2px solid var(--line);background:rgba(255,255,255,.03)}
.sk{width:60px;height:60px;background:var(--acc)}
#mid{display:flex;align-items:center;justify-content:center;gap:14px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.bar{position:relative;width:30px;height:70%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fill{position:absolute;left:0;right:0;background:var(--acc)}
.bar span{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim)}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:center}
.col b{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim)}
#kick{width:min(65%,210px);aspect-ratio:1;border-radius:50%;font-size:22px;font-weight:800;border:3px solid var(--kick);color:var(--kick);touch-action:none}
#kick.active{background:var(--kick);color:#000}

/* ---- телеметрія ---- */
#tele{flex:1;display:none;overflow:auto;touch-action:pan-y;padding:10px;user-select:text}
#tele .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:10px 12px}
.card.ok{border-left-color:var(--acc)}.card.warn{border-left-color:var(--warn)}.card.bad{border-left-color:var(--bad)}
.card h4{margin:0 0 6px;font-size:13px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between}
.card .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.card .row2{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--txt)}
.ok .chip{background:var(--acc);color:#000}.warn .chip{background:var(--warn);color:#000}.bad .chip{background:var(--bad);color:#fff}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
#tele .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--dim);font-size:13px}

#rot{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:24px;z-index:10}
@media (orientation:portrait){#rot{display:flex}}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;max-height:92vh;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.row{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:8px 0}
.row input[type=range]{width:100%}
.chk{display:flex;gap:20px;margin:12px 0;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <button id="conn">Підключити</button>
  <span id="status"><span class="dot" id="dot"></span><span id="stxt">Не підключено</span></span>
  <button id="run" disabled title="Запустити програму на хабі">▶</button>
  <button id="halt" disabled title="Зупинити програму">■</button>
  <div class="seg"><button id="mTilt">Нахил</button><button id="mStick">Джойстик</button></div>
  <button id="side" title="Поміняти сторони: рух / удар">⇄</button>
  <div class="seg"><button id="tPad" title="Пульт">🎮</button><button id="tTele" title="Телеметрія">📊</button></div>
  <button id="fs" title="На весь екран">⛶</button>
  <button id="set" title="Налаштування">⚙</button>
</header>

<main id="pad">
  <div class="zone" id="drive">
    <div id="gas">ГАЗ</div>
    <div class="sb" id="sb"></div><div class="sk" id="sk"></div>
    <div id="hint"></div>
  </div>
  <div id="mid">
    <div class="col"><div class="bar"><div class="fill" id="fL"></div><span>L</span></div><b id="nL">0</b></div>
    <div class="col"><div class="bar"><div class="fill" id="fR"></div><span>R</span></div><b id="nR">0</b></div>
  </div>
  <div class="zone" id="act"><button id="kick" disabled>УДАР</button></div>
</main>

<section id="tele">
  <div class="grid">
    <div class="card" id="cBat"><h4>Батарея <span class="chip" id="bChip">—</span></h4><div class="big" id="bV">—</div><div class="row2"><span id="bA">— А</span><span id="bMin">мін. —</span></div></div>
    <div class="card" id="cLink"><h4>Зв’язок <span class="chip" id="lChip">—</span></h4><div class="big" id="lAge">—</div><div class="row2"><span id="lRate">— пак/с</span><span id="lDrops">розривів: 0</span></div></div>
    <div class="card" id="cE"><h4>Ліве колесо · E <span class="chip">—</span></h4><div class="big">—</div><div class="row2"><span>—</span><span>—</span></div><div class="meter"><i></i></div></div>
    <div class="card" id="cF"><h4>Праве колесо · F <span class="chip">—</span></h4><div class="big">—</div><div class="row2"><span>—</span><span>—</span></div><div class="meter"><i></i></div></div>
    <div class="card" id="cB"><h4>Кікер · B <span class="chip">—</span></h4><div class="big">—</div><div class="row2"><span>—</span><span>—</span></div><div class="meter"><i></i></div></div>
  </div>
  <div class="foot"><span id="tNote">Телеметрія приходить, лише коли програма працює і пульт підключено.</span><button id="tReset">Скинути лічильники</button></div>
</section>

<div id="rot">Поверни телефон горизонтально ↻<br><small style="color:var(--dim)">або торкнись тут — розверну сам</small></div>

<dialog id="dlg">
  <h3 style="margin-top:0">Налаштування</h3>
  <div class="row"><label>Макс. швидкість, %</label><input type="range" data-k="max" min="30" max="100" step="5"><output></output></div>
  <div class="row"><label>Нахил до 100 %, °</label><input type="range" data-k="tilt" min="10" max="45" step="1"><output></output></div>
  <div class="row"><label>Мертва зона, °</label><input type="range" data-k="dz" min="0" max="10" step="1"><output></output></div>
  <div class="row"><label>Сила повороту</label><input type="range" data-k="turn" min="0.3" max="1" step="0.05"><output></output></div>
  <div class="row"><label>Експо (м'якість)</label><input type="range" data-k="expo" min="0" max="1" step="0.05"><output></output></div>
  <div class="chk">
    <label><input type="checkbox" data-k="invT"> Інверсія газу (нахил)</label>
    <label><input type="checkbox" data-k="invS"> Інверсія повороту (нахил)</label>
  </div>
  <button id="close">Готово</button>
</dialog>

<script>
"use strict";
const SVC = 'c5f50001-8280-46da-89f4-6d8051e4aeef';
const CHR = 'c5f50002-8280-46da-89f4-6d8051e4aeef';
const $ = id => document.getElementById(id);
const RAD = 180 / Math.PI;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- налаштування ----------
const DEF = { max: 100, tilt: 25, dz: 4, turn: 0.7, expo: 0.5, invT: false, invS: false, mode: 'stick', swap: false, tab: 'pad' };
const cfg = { ...DEF };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('spikePult') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('spikePult', JSON.stringify(cfg)); } catch (e) {} };

// ---------- BLE ----------
let dev = null, chr = null, busy = false, pending = null, running = false, lowBat = false;
const dec = new TextDecoder();
let rx = '';

async function connect() {
  if (chr) { dev.gatt.disconnect(); return; }
  if (!navigator.bluetooth) { alert('Web Bluetooth недоступний. Відкрий сторінку в Chrome на Android через HTTPS.'); return; }
  try {
    status('Підключення…', 'mid');
    if (!dev) {
      dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
      dev.addEventListener('gattserverdisconnected', onLost);
    }
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(SVC);
    const c = await svc.getCharacteristic(CHR);
    c.addEventListener('characteristicvaluechanged', onNote);
    try { await c.startNotifications(); } catch (e) {}
    chr = c; busy = false; pending = null; rx = '';
    wake(); buzz(40); ui();
  } catch (e) {
    console.warn(e); chr = null; ui();
    status('Не підключено: ' + (e.message || e), 'bad');
  }
}
function onLost() {
  chr = null; running = false; release(); stats.drops++; ui();
  status('Зв’язок втрачено — натисни «Перепідключити»', 'bad'); buzz([120, 60, 120]);
}
function onNote(e) {
  const d = e.target.value, type = d.getUint8(0);
  if (type === 0x00 && d.byteLength >= 5) {          // статус хаба
    const f = d.getUint32(1, true);
    running = !!(f & (1 << 6)); lowBat = !!(f & 1); ui();
  } else if (type === 0x01) {                          // stdout програми
    rx += dec.decode(new Uint8Array(d.buffer, d.byteOffset + 1, d.byteLength - 1), { stream: true });
    let i;
    while ((i = rx.indexOf('\n')) >= 0) { parseLine(rx.slice(0, i).trim()); rx = rx.slice(i + 1); }
    if (rx.length > 1000) rx = '';
  }
}
function cmd(bytes) { pending = new Uint8Array(bytes); }

// ---------- керування ----------
let kickOn = false, kickLatch = false;

// Відправка ~25 разів на секунду; поки попередній запис не завершився — пропускаємо.
setInterval(() => {
  const [l, r] = chr ? control() : [0, 0];
  draw(l, r);
  if (!chr || busy) return;
  const isCmd = !!pending;
  const k = (kickOn || kickLatch) ? 1 : 0;
  const pkt = pending || new Uint8Array([0x06, 0xFF, l + 128, r + 128, 128 + k]);
  if (!isCmd) kickLatch = false;          // короткий тап гарантовано пішов хоча б одним кадром
  pending = null; busy = true;
  chr.writeValueWithResponse(pkt)
    .catch(() => { if (isCmd && pkt[0] === 0x01 && pkt.length === 2) pending = new Uint8Array([0x01]); })
    .finally(() => { busy = false; });
}, 40);

// ---------- датчик нахилу ----------
let gx = 0, gy = 0, gz = 9.81, haveMotion = false;
addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  const k = 0.25; gx += k * (a.x - gx); gy += k * (a.y - gy); gz += k * (a.z - gz);
  haveMotion = true;
});
function angles() {
  const g = Math.hypot(gx, gy, gz) || 9.81;
  return { roll: Math.asin(clamp(gy / g, -1, 1)) * RAD, pitch: Math.atan2(gx, gz) * RAD };
}
function orientSign() {
  const a = (screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation || 0);
  return (a === 270 || a === -90) ? -1 : 1;
}
function shape(v, dz, max) {
  const a = Math.abs(v); if (a <= dz) return 0;
  let x = Math.min(1, (a - dz) / (max - dz));
  x = cfg.expo * x * x * x + (1 - cfg.expo) * x;
  return Math.sign(v) * x;
}

let gasOn = false, base = { roll: 0, pitch: 0 };
const stick = { on: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const SR = 70;

function control() {
  let t = 0, s = 0;
  if (cfg.mode === 'tilt') {
    if (gasOn && haveMotion) {
      const a = angles(), sg = orientSign();
      let dp = a.pitch - base.pitch; dp = ((dp + 540) % 360) - 180;
      t = shape(-sg * dp, cfg.dz, cfg.tilt);
      s = shape(-sg * (a.roll - base.roll), cfg.dz, cfg.tilt);
      if (cfg.invT) t = -t;
      if (cfg.invS) s = -s;
    }
  } else if (stick.on) {
    t = shape(-stick.y, 0.08, 1);
    s = shape(-stick.x, 0.08, 1);
  }
  s *= cfg.turn;
  let l = t - s, r = t + s;
  const m = Math.max(1, Math.abs(l), Math.abs(r)); l /= m; r /= m;
  return [Math.round(l * cfg.max), Math.round(r * cfg.max)];
}

function release() {
  gasOn = false; $('gas').classList.remove('active');
  stick.on = false; stick.id = null; place();
  kickOn = false; $('kick').classList.remove('active');
}

const gas = $('gas');
gas.addEventListener('pointerdown', e => {
  e.preventDefault(); gas.setPointerCapture(e.pointerId);
  base = angles(); gasOn = true; gas.classList.add('active'); buzz(15);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => gas.addEventListener(t, () => { gasOn = false; gas.classList.remove('active'); }));

const zone = $('drive'), sb = $('sb'), sk = $('sk');
zone.addEventListener('pointerdown', e => {
  if (cfg.mode !== 'stick' || stick.on) return;
  e.preventDefault(); zone.setPointerCapture(e.pointerId);
  const r = zone.getBoundingClientRect();
  Object.assign(stick, { on: true, id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, x: 0, y: 0 });
  place();
});
zone.addEventListener('pointermove', e => {
  if (!stick.on || e.pointerId !== stick.id) return;
  const r = zone.getBoundingClientRect();
  let dx = e.clientX - r.left - stick.ox, dy = e.clientY - r.top - stick.oy;
  const d = Math.hypot(dx, dy); if (d > SR) { dx *= SR / d; dy *= SR / d; }
  stick.x = dx / SR; stick.y = dy / SR; place();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => zone.addEventListener(t, e => {
  if (e.pointerId === stick.id) { stick.on = false; stick.id = null; place(); }
}));
function place() {
  const v = stick.on ? 'block' : 'none';
  sb.style.display = sk.style.display = v;
  sb.style.left = stick.ox + 'px'; sb.style.top = stick.oy + 'px';
  sk.style.left = (stick.ox + stick.x * SR) + 'px'; sk.style.top = (stick.oy + stick.y * SR) + 'px';
}

const kickBtn = $('kick');
kickBtn.addEventListener('pointerdown', e => {
  if (!chr) return;
  e.preventDefault(); kickBtn.setPointerCapture(e.pointerId);
  kickOn = true; kickLatch = true; stats.kicks++; kickBtn.classList.add('active'); buzz(30);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => kickBtn.addEventListener(t, () => { kickOn = false; kickBtn.classList.remove('active'); }));

addEventListener('blur', release);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); else release(); });

// ---------- телеметрія ----------
const KICK_STATES = ['готовий', 'удар', 'повернення'];
const stats = { drops: 0, kicks: 0, stallE: 0, stallF: 0, stallB: 0, minV: null };
let tele = null, teleTimes = [], prevStall = { E: 0, F: 0, B: 0 };

function parseMotor(s) {
  if (!s || s === 'x') return null;
  const [spd, load, st] = s.split(':').map(Number);
  return { spd, load, st: !!st };
}
function parseLine(line) {
  if (!line.startsWith('T|')) return;
  const p = line.split('|');
  if (p.length < 9) return;
  const now = performance.now();
  tele = {
    t: now, mv: +p[1], ma: +p[2], cl: +p[3], cr: +p[4],
    E: parseMotor(p[5]), F: parseMotor(p[6]), B: parseMotor(p[7]), ks: +p[8]
  };
  teleTimes.push(now); while (teleTimes.length && now - teleTimes[0] > 3000) teleTimes.shift();
  if (stats.minV == null || tele.mv < stats.minV) stats.minV = tele.mv;
  for (const k of ['E', 'F', 'B']) {
    const st = tele[k] && tele[k].st ? 1 : 0;
    if (st && !prevStall[k]) stats['stall' + k]++;
    prevStall[k] = st;
  }
}

function setCard(id, cls, chip, big, a, b, meter) {
  const c = $(id); c.className = 'card ' + cls;
  c.querySelector('.chip').textContent = chip;
  c.querySelector('.big').textContent = big;
  const sp = c.querySelectorAll('.row2 span'); sp[0].textContent = a; sp[1].textContent = b;
  const m = c.querySelector('.meter i'); if (m) m.style.width = clamp(meter || 0, 0, 100) + '%';
}

// Оцінка стану колеса: відсутній / застряг / не тягне / ОК.
function wheel(id, m, cmdSpd, stalls) {
  if (!tele) return setCard(id, '', '—', '—', 'задано —', 'застрягань: ' + stalls, 0);
  if (!m) return setCard(id, 'bad', 'немає мотора', '—', 'перевір кабель', 'застрягань: ' + stalls, 0);
  let cls = 'ok', chip = 'OK';
  if (m.st) { cls = 'bad'; chip = 'застряг'; }
  else if (Math.abs(cmdSpd) >= 200 && Math.abs(m.spd) < Math.abs(cmdSpd) * 0.4) { cls = 'warn'; chip = 'не тягне'; }
  setCard(id, cls, chip, m.spd + ' °/с', 'задано ' + cmdSpd + ' °/с · навант. ' + m.load, 'застрягань: ' + stalls,
    Math.abs(m.load) / 2);   // ~200 мН·м ≈ повна шкала
}

function renderTele() {
  const age = tele ? performance.now() - tele.t : Infinity;
  const fresh = age < 1000;
  // Батарея (пороги орієнтовні для акумулятора SPIKE)
  if (tele) {
    const v = tele.mv / 1000;
    const cls = v >= 7.6 ? 'ok' : v >= 7.1 ? 'warn' : 'bad';
    setCard('cBat', fresh ? cls : '', fresh ? (cls === 'ok' ? 'норма' : cls === 'warn' ? 'підзаряди' : 'сідає') : 'застаріло',
      v.toFixed(2) + ' В', (tele.ma / 1000).toFixed(2) + ' А', 'мін. ' + (stats.minV / 1000).toFixed(2) + ' В');
  }
  // Зв’язок
  const rate = teleTimes.length > 1 ? (teleTimes.length - 1) / ((teleTimes[teleTimes.length - 1] - teleTimes[0]) / 1000) : 0;
  setCard('cLink', !chr ? 'bad' : fresh ? 'ok' : 'warn', !chr ? 'немає' : fresh ? 'є' : 'тиша',
    tele ? (age < 10000 ? Math.round(age) + ' мс тому' : 'давно') : '—',
    rate ? rate.toFixed(1) + ' пак/с' : '— пак/с', 'розривів: ' + stats.drops);
  if (!fresh) {
    for (const id of ['cE', 'cF', 'cB']) $(id).className = 'card';
    if (!tele) { wheel('cE', null, 0, stats.stallE); wheel('cF', null, 0, stats.stallF); }
    return;
  }
  wheel('cE', tele.E, tele.cl, stats.stallE);
  wheel('cF', tele.F, tele.cr, stats.stallF);
  // Кікер
  const b = tele.B;
  if (!b) setCard('cB', 'bad', 'немає мотора', '—', 'перевір кабель', 'ударів: ' + stats.kicks, 0);
  else setCard('cB', b.st ? 'warn' : 'ok', KICK_STATES[tele.ks] || '—', b.spd + ' °/с',
    'навант. ' + b.load + ' · застрягань: ' + stats.stallB, 'ударів: ' + stats.kicks, Math.abs(b.load) / 2);
}
setInterval(() => { if (cfg.tab === 'tele') renderTele(); ui(); }, 200);

$('tReset').onclick = () => {
  Object.assign(stats, { drops: 0, kicks: 0, stallE: 0, stallF: 0, stallB: 0, minV: tele ? tele.mv : null });
  renderTele();
};

// ---------- екран ----------
let wl = null;
async function wake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
async function landscape() {
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); await screen.orientation.lock('landscape'); } catch (e) {}
}
$('fs').onclick = landscape;
$('rot').onclick = landscape;

// ---------- UI ----------
function status(t, c) { $('stxt').textContent = t; $('dot').className = 'dot ' + (c || ''); }
function ui() {
  $('conn').textContent = chr ? 'Відключити' : (dev ? 'Перепідключити' : 'Підключити');
  $('run').disabled = $('halt').disabled = !chr;
  kickBtn.disabled = !chr;
  if (chr) {
    const v = tele && performance.now() - tele.t < 2000 ? ` · ${(tele.mv / 1000).toFixed(1)} В` : '';
    status(`${dev.name || 'Хаб'} · ${running ? 'працює' : 'програма зупинена'}${v}${lowBat ? ' · 🔋 низький заряд' : ''}`, running ? 'ok' : 'mid');
  }
  $('mTilt').classList.toggle('on', cfg.mode === 'tilt');
  $('mStick').classList.toggle('on', cfg.mode === 'stick');
  $('tPad').classList.toggle('on', cfg.tab === 'pad');
  $('tTele').classList.toggle('on', cfg.tab === 'tele');
  $('pad').style.display = cfg.tab === 'pad' ? 'grid' : 'none';
  $('tele').style.display = cfg.tab === 'tele' ? 'block' : 'none';
  $('pad').classList.toggle('swap', !!cfg.swap);
  gas.style.display = cfg.mode === 'tilt' ? 'flex' : 'none';
  $('hint').textContent = cfg.mode === 'tilt'
    ? 'Тримай ГАЗ і нахиляй телефон. Відпустив — стоп.'
    : 'Торкнись будь-де в цій зоні й веди пальцем.';
}
function bar(el, v) {
  const h = Math.abs(v) / 2;
  el.style.height = h + '%';
  el.style.top = v >= 0 ? (50 - h) + '%' : '50%';
}
function draw(l, r) { bar($('fL'), l); bar($('fR'), r); $('nL').textContent = l; $('nR').textContent = r; }

$('conn').onclick = connect;
$('run').onclick = () => cmd([0x01, 0x00]);
$('halt').onclick = () => cmd([0x00]);
$('mTilt').onclick = () => { cfg.mode = 'tilt'; save(); release(); ui(); };
$('mStick').onclick = () => { cfg.mode = 'stick'; save(); release(); ui(); };
$('side').onclick = () => { cfg.swap = !cfg.swap; save(); release(); ui(); buzz(15); };
$('tPad').onclick = () => { cfg.tab = 'pad'; save(); ui(); };
$('tTele').onclick = () => { cfg.tab = 'tele'; save(); release(); ui(); renderTele(); };

const dlg = $('dlg');
$('set').onclick = () => { release(); dlg.showModal(); };
$('close').onclick = () => dlg.close();
dlg.querySelectorAll('input[type=range]').forEach(i => {
  const o = i.nextElementSibling, k = i.dataset.k;
  i.value = cfg[k]; o.textContent = cfg[k];
  i.oninput = () => { cfg[k] = +i.value; o.textContent = i.value; save(); };
});
dlg.querySelectorAll('input[type=checkbox]').forEach(i => {
  const k = i.dataset.k; i.checked = !!cfg[k];
  i.onchange = () => { cfg[k] = i.checked; save(); };
});

ui();

// ---------- офлайн (PWA) ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(e => console.warn('SW:', e));
}
</script>
</body>
</html>
